# No `name:`, so Compose takes the project from the directory; only these ports clash.
services:
  db:
    image: postgres:18
    restart: always

    environment:
      POSTGRES_DB: calliope
      POSTGRES_USER: calliope
      POSTGRES_PASSWORD: calliope

    ports:
      - "${POSTGRES_PORT:-54322}:5432"

    # **Over TCP, not the socket.** On a fresh volume the image first runs a temporary server that
    # listens on the Unix socket only, creates the database, and shuts down again before the real
    # one starts. `pg_isready` without `-h` asks the socket and calls that temporary server ready;
    # whoever connects in that half second meets the restart — "the database system is starting up",
    # which is how CI run #55 failed. The temporary server never listens on TCP, so asking over TCP
    # is ready exactly when the real one is.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U calliope -d calliope"]
      interval: 1s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8
    restart: always

    ports:
      - "${REDIS_PORT:-63792}:6379"

    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 1s
      timeout: 5s
      retries: 10

  # Local mail capture
  mailpit:
    image: axllent/mailpit:v1.31.2
    restart: always

    ports:
      - "${SMTP_PORT:-1025}:1025" # SMTP
      - "${MAILPIT_PORT:-8025}:8025" # Web interface

    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 1s
      timeout: 5s
      retries: 10
